<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 15px 0;
        }
        main {
            width: 75%;
            margin: 20px auto;
        }
        h2 {
            text-align: left;
        }
        .center-text {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #e8eaf6;
            text-align: center;
        }
        fieldset {
            padding: 15px;
            border: 1px solid #555;
        }
        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            margin-top: 4px;
        }
        textarea {
            height: 100px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <div class="center-text">Available Courses</div>
            <table>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <form action="submit.php" method="POST">
                <fieldset>
                    <legend>Application Form</legend>
                    
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required><br><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="course-select">Course:</label><br>
                    <select id="course-select" name="course">
                        <option value="cse" selected>B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select><br><br>

                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement"></textarea><br><br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>

</body>
</html>
